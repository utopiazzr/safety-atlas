[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asl-agent-security-lab"
version = "0.6.0"
description = "Measure whether a coding agent introduces a weak crypto algorithm when a spec constrains only the output format"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai-security", "coding-agent", "cwe-327", "red-team", "measurement"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
asl = "asl:main"

[tool.setuptools]
py-modules = ["asl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning"]
