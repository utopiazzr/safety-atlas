name: 提交公开安全案例
description: 分享已脱敏的案例或补充证据。请勿在公开 Issue 中提交秘密和未披露漏洞细节。
title: "[Case] "
body:
  - type: input
    id: product
    attributes:
      label: 产品与版本
      placeholder: 不确定时请说明
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 发生了什么
      description: 预期行为、实际行为与环境。
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 公开来源或脱敏证据
    validations:
      required: true
  - type: checkboxes
    id: consent
    attributes:
      label: 公开提交确认
      options:
        - label: 我已移除敏感信息，并了解此 Issue 将公开可见。
          required: true
