name: Sync catalogue publication
on:
  push:
    branches: [main]
    paths: [data/signals.json]
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: atlas-publication
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/sync-publication.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
