name: Prepare automatic community drafts
on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: atlas-auto-drafts
  cancel-in-progress: false
env:
  ATLAS_AUTOMATIC_PROPOSAL: "true"
jobs:
  select:
    if: github.repository == 'utopiazzr/safety-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      issue: ${{ steps.queue.outputs.issue }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - id: queue
        run: node scripts/select-auto-draft.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  prepare:
    needs: select
    if: needs.select.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/curate-community.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
      - run: npm ci --ignore-scripts
      - run: npm test && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-proposal
          path: |
            work/candidate/catalogue.json
            work/candidate/proposal-context.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: [select, prepare]
    concurrency:
      group: atlas-review-${{ needs.select.outputs.issue }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-proposal
          path: work/review-artifact
      - run: node scripts/open-review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_ISOLATED_REVIEW: "true"
          ATLAS_ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
  record:
    needs: [select, prepare, publish]
    if: always() && needs.select.outputs.issue != ''
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node scripts/finish-auto-draft.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_ISSUE_NUMBER: ${{ needs.select.outputs.issue }}
          ATLAS_PUBLISH_RESULT: ${{ needs.publish.result }}
