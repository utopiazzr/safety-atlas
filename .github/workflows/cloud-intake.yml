name: Cloud intake bridge
on:
  workflow_dispatch:
    inputs:
      action:
        description: Import opt-in public proposals / curated summaries and clean expired uploads, or health check only
        type: choice
        options: [sync, health]
        default: sync
      submission_id:
        description: Optional public or approved submission UUID
        type: string
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
  issues: write
  id-token: write
concurrency:
  group: atlas-cloud-intake
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'utopiazzr/safety-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node scripts/cloud-intake.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
