name: Receive community signal
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue to receive after maintainer triage"
        required: true
        type: string
permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write
concurrency:
  group: atlas-intake-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  receive:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request == null && github.event.label.name == 'atlas:triage' && github.event.sender.type != 'Bot'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node scripts/intake-signal.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: intake-${{ github.event.issue.number || inputs.issue_number }}
          path: work/candidate/
          retention-days: 14
