name: Release installable safety plugin
on:
  push:
    tags: ['product-v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check ./product
      - name: Verify release version
        run: python -c "import os,tomllib; v=tomllib.load(open('product/pyproject.toml','rb'))['project']['version']; assert os.environ['GITHUB_REF_NAME']=='product-v'+v"
      - run: python -m unittest discover -s product/tests -q
      - run: python -m pip wheel --no-deps --wheel-dir release-dist ./product
      - name: Publish plugin wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release-dist/*.whl
          --verify-tag --title "Safety Atlas plugin ${GITHUB_REF_NAME#product-v}"
          --notes "Install the wheel with Python 3.11+ and run scisec-agent quickstart --open. Supports opt-in Python tool monitoring, configured permission checks, evaluation reports and regression comparison. See product/README.md for integration."
