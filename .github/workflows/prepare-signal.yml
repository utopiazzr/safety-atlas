name: Prepare community signal
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Public issue number to prepare
        required: true
        type: string
      mode:
        description: Normalize materials or draft a visual storyboard
        type: choice
        options: [normalize, storyboard]
        default: normalize
permissions:
  contents: read
  issues: read
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node scripts/prepare-signal.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_ISSUE_NUMBER: ${{ inputs.issue_number }}
          ATLAS_MODE: ${{ inputs.mode }}
          ATLAS_MODEL_BASE_URL: ${{ vars.ATLAS_MODEL_BASE_URL }}
          ATLAS_MODEL_ID: ${{ vars.ATLAS_MODEL_ID }}
          ATLAS_MODEL_API_KEY: ${{ secrets.ATLAS_MODEL_API_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signal-candidate
          path: work/candidate/
          retention-days: 14
