name: Validate catalogue
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  issues: read
concurrency:
  group: validate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - run: npm ci --ignore-scripts && npm test && npm run build && npm run validate
        working-directory: cloud
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test && npm run build
      - run: node scripts/validate-catalogue.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_CHECK_SNAPSHOTS: "true"
