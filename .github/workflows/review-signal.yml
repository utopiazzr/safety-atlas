name: Review community signal
on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Public Issue number / 投稿编号"
        type: string
        required: true
      decision:
        description: "Request evidence, mark duplicate, decline, or propose catalogue change"
        type: choice
        options: [request-info, duplicate, decline, draft-new, draft-update]
        required: true
      title:
        description: "Neutral entry title (required for draft-new)"
        type: string
      summary:
        description: "Attributed, bounded summary (required for draft-new)"
        type: string
      evidence_type:
        description: "Source class; never a verification badge"
        type: choice
        options:
          [
            community-report,
            vendor-advisory,
            research-poc,
            paper,
            project,
            model-card,
          ]
      source_url:
        description: "Primary source checked by reviewer (required for a proposal)"
        type: string
      target_id:
        description: "Existing entry ID (required for draft-update or duplicate)"
        type: string
      context:
        description: "Product/version/access or model/budget/configuration"
        type: string
      limitations:
        description: "Limits, uncertainty and scope; one per line"
        type: string
      rationale:
        description: "Decision reason; mention what was checked and what remains unknown"
        type: string
        required: true
permissions:
  contents: read
  issues: read
concurrency:
  group: atlas-review-${{ inputs.issue_number }}
  cancel-in-progress: false
jobs:
  decision:
    if: github.ref == 'refs/heads/main' && !startsWith(inputs.decision, 'draft-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: node scripts/review-signal.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
  prepare:
    if: github.ref == 'refs/heads/main' && startsWith(inputs.decision, 'draft-')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/review-signal.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts
      - run: npm test && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-proposal
          path: |
            work/candidate/catalogue.json
            work/candidate/proposal-context.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-proposal
          path: work/review-artifact
      - run: node scripts/open-review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_ISOLATED_REVIEW: "true"
