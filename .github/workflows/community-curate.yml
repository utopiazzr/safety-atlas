name: Curate public proposal
on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Public proposal Issue number; read sources before running
        type: string
        required: true
permissions:
  contents: read
  issues: read
concurrency:
  group: atlas-review-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'utopiazzr/safety-atlas' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event.label.name == 'atlas:propose')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: node scripts/curate-community.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts
      - run: npm test && npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tested-proposal
          path: |
            work/candidate/catalogue.json
            work/candidate/proposal-context.json
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: write
      pull-requests: write
      statuses: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tested-proposal
          path: work/review-artifact
      - run: node scripts/open-review.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ATLAS_ISOLATED_REVIEW: "true"
