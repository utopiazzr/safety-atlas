[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scisec-agent-product"
version = "0.2.0"
description = "Agent evaluation and observation product interfaces"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
otel = ["opentelemetry-sdk>=1.37,<2"]
langchain = ["langchain-core>=1.8,<2", "opentelemetry-sdk>=1.37,<2"]
langchain-guard = ["langchain>=1.5.2,<1.6"]
resource-guard = ["langchain>=1.5.2,<1.6", "pycasbin==2.8.0"]
faithfulness = ["ragas==0.4.4", "openai>=1,<3", "httpx>=0.27,<1"]

[project.scripts]
scisec-agent = "scisec_agent.__main__:main"

[tool.setuptools]
packages = ["scisec_agent"]
